name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi

      - name: Beri Izin Akses Gradle
        run: chmod +x gradlew

      #- name: Remove debug signingConfig from build.gradle.kts
      #  run: |
      #    sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' app/build.gradle.kts

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: RupiahKu-debug
          path: app/build/outputs/apk/debug/*.apk
